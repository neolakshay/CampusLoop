class: UsernamePasswordAccount
serverOnly: true
table: username_password_account
fields:
  authUserId: UuidValue, relation(parent=serverpod_auth_core_user, onDelete=Cascade)
  username: String
  usernameKey: String
  passwordHash: String
  createdAt: DateTime, default=now
indexes:
  username_password_account_username_key_unique_idx:
    fields: usernameKey
    unique: true
  username_password_account_auth_user_unique_idx:
    fields: authUserId
    unique: true
