name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: campus_loop_server
        run: serverpod generate

      - name: Verify generated protocol is committed
        run: >-
          git diff --exit-code --
          campus_loop_server/lib/src/generated
          campus_loop_server/test/integration/test_tools
          campus_loop_client/lib/src/protocol

      - name: Configure disposable embedded database password
        shell: bash
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "SERVERPOD_PASSWORD_database=$password" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: campus_loop_server
        run: dart test

      - name: Run Flutter tests
        working-directory: campus_loop_flutter
        run: flutter test

      - name: Build Flutter web app
        working-directory: campus_loop_flutter
        run: flutter build web --base-href /
